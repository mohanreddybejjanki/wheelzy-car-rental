<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar">
    <div class="nav-container">
        <a href="/" class="nav-brand">
            <i class="fas fa-car"></i>
            <span>Wheelzy<span class="brand-accent">Rentals</span></span>
        </a>

        <div class="nav-links">
            <a href="/cars" class="nav-link"><i class="fas fa-search"></i> Browse Cars</a>
            <a href="/about" class="nav-link"><i class="fas fa-info-circle"></i> About</a>

            <!-- Logged in user -->
            <div th:if="${user != null}" class="nav-user-group">
                <a href="/notifications" class="nav-link notif-bell">
                    <i class="fas fa-bell"></i>
                    <span th:if="${unreadCount != null and unreadCount > 0}"
                          class="badge" th:text="${unreadCount}">0</span>
                </a>
                <div class="nav-dropdown">
                    <button class="nav-link dropdown-toggle">
                        <i class="fas fa-user-circle"></i>
                        <span th:text="${user.name}">User</span>
                        <i class="fas fa-chevron-down fa-xs"></i>
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">
                            <small th:text="${user.email}">email</small>
                            <span class="role-badge" th:text="${user.role}">RENTER</span>
                        </div>
                        <a th:if="${user.role.name() == 'OWNER'}" href="/owner/dashboard" class="dropdown-item">
                            <i class="fas fa-tachometer-alt"></i> Owner Dashboard
                        </a>
                        <a th:if="${user.role.name() == 'OWNER'}" href="/owner/bookings" class="dropdown-item">
                            <i class="fas fa-clipboard-list"></i> Manage Bookings
                        </a>
                        <a th:if="${user.role.name() == 'OWNER'}" href="/owner/cars/add" class="dropdown-item">
                            <i class="fas fa-plus-circle"></i> List My Car
                        </a>
                        <a th:if="${user.role.name() == 'RENTER'}" href="/bookings/my" class="dropdown-item">
                            <i class="fas fa-ticket-alt"></i> My Bookings
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="/logout" class="dropdown-item text-danger">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <!-- Guest -->
            <div th:if="${user == null}" class="nav-auth">
                <a href="/login" class="btn btn-outline-blue">Login</a>
                <a href="/register" class="btn btn-blue">Sign Up Free</a>
            </div>
        </div>

        <button class="nav-toggle" onclick="toggleMobileNav()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>
</body>
</html>
