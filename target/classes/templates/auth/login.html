<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="auth-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-car"></i></div>
            <h2>Welcome Back!</h2>
            <p>Login to continue your journey with Wheelzy</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
        </div>

        <form action="/login" method="post" class="auth-form">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-with-eye">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required/>
                    <button type="button" class="eye-btn" onclick="togglePassword()"><i class="fas fa-eye" id="eyeIcon"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-blue w-full btn-lg">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="auth-divider"><span>Quick Demo Logins</span></div>
        <div class="demo-logins">
            <div class="demo-card" onclick="fillLogin('renter@example.com','renter123')">
                <i class="fas fa-user"></i>
                <div><strong>Renter</strong><small>renter@example.com</small></div>
            </div>
            <div class="demo-card" onclick="fillLogin('rahul@example.com','rahul123')">
                <i class="fas fa-car-side"></i>
                <div><strong>Owner</strong><small>rahul@example.com</small></div>
            </div>
            <div class="demo-card" onclick="fillLogin('admin@wheelzy.com','admin123')">
                <i class="fas fa-cog"></i>
                <div><strong>Admin</strong><small>admin@wheelzy.com</small></div>
            </div>
        </div>

        <p class="auth-footer">Don't have an account? <a href="/register">Sign up free</a></p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script>
function fillLogin(email, pass) {
    document.querySelector('input[name="email"]').value = email;
    document.querySelector('input[name="password"]').value = pass;
}
function togglePassword() {
    var p = document.getElementById('password');
    var icon = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { p.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
</body>
</html>
